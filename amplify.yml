version: 1
frontend:
  phases:
    preBuild:
      commands:
        # These run from the repo root (my_todo_lab) by default
        - cd todo_backend && npm ci
        - cd ../todo_frontend && npm ci   # go back to root first

    build:
      commands:
        - cd .. && cd todo_backend && npm run build
        - cd .. && cd todo_frontend && npm run build

        # Assemble artifact
        - mkdir -p build
        - cp -r todo_frontend/out/* build/
        - cp -r todo_backend/dist build/api
        - cp todo_backend/package.json build/api/
        - cd build/api && npm ci --production

  artifacts:
    baseDirectory: build
    files:
      - "**/*"

  cache:
    paths:
      - todo_backend/node_modules/**/*
      - todo_frontend/node_modules/**/*