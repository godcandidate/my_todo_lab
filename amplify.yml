version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd $CODEBUILD_SRC_DIR/todo_backend && npm ci
        - cd $CODEBUILD_SRC_DIR/todo_frontend && npm ci

    build:
      commands:
        - cd $CODEBUILD_SRC_DIR/todo_backend && npm run build
        - cd $CODEBUILD_SRC_DIR/todo_frontend && npm run build

        - mkdir -p build
        - cp -r $CODEBUILD_SRC_DIR/todo_frontend/out/* build/
        - cp -r $CODEBUILD_SRC_DIR/todo_backend/dist build/api
        - cp $CODEBUILD_SRC_DIR/todo_backend/package.json build/api/
        - cd build/api && npm ci --production

  artifacts:
    baseDirectory: build
    files:
      - "**/*"

  cache:
    paths:
      - todo_frontend/node_modules/**/*
      - todo_backend/node_modules/**/*